# bench/templates/docker-stack.base.yml — 4 토글 모두 off 의 완전 비활성 baseline (Phase 5 D-m1-18)
#
# Services: mysql + nest-baseline + redis-master + prometheus + grafana + cadvisor + node-exporter (정확히 7개)
# nest-baseline 빌드: back/Dockerfile.dev-in-local (D-E1 lock — 모든 차원 조합에서 동일)
# nest-baseline 명명: _example-min.yaml slots[0].name="baseline" 컨벤션 일관 (D-A1)
# redis-master 명명: γ patch (replica + sentinel*3) pure additive 자연 수용 (D-A2)
# 차원 활성 산출물 0건 (D-D3): δ / β nest 추가 슬롯 / α 이미지 override / γ replica·sentinel — 모두 patch 책임

version: "3.8"
services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: "${VM_REALTICKET_MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: real_ticket
      MYSQL_USER: donggle
      MYSQL_PASSWORD: "${VM_REALTICKET_MYSQL_PASSWORD}"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 2G
    ports:
      - "3307:3306"
    volumes:
      - realticket_mysql_data_shared:/var/lib/mysql
    networks:
      - realticket
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$VM_REALTICKET_MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5
  nest-baseline:
    build:
      context: ./back
      dockerfile: Dockerfile.dev-in-local
    image: nest:m1-self-dry-run
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      labels:
        com.docker.stack.namespace: app
        version: "baseline"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "8080:8080"
    environment:
      DATABASE_TYPE: "mysql"
      DATABASE_HOST: "mysql"
      DATABASE_PORT: "3306"
      DATABASE_USERNAME: "root"
      DATABASE_PASSWORD: "${VM_REALTICKET_MYSQL_ROOT_PASSWORD}"
      DATABASE_SCHEMA: "real_ticket"
      DATABASE_SYNCHRONIZE: "false"
      REDIS_HOST: "redis-master"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_SENTINEL_MODE: "false"
      APP_VERSION: "baseline"
    depends_on:
      - mysql
      - redis-master
    networks:
      - realticket
  redis-master:
    image: redis:7-alpine
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 1G
      labels:
        com.docker.stack.namespace: app
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realticket
  prometheus:
    image: prom/prometheus:v2.55.1
    user: "65534:65534"
    deploy:
      replicas: 1
      labels:
        com.docker.stack.namespace: monitoring
    volumes:
      - type: bind
        source: /home/kyu4583/web04-RealTicket/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - realticket
  grafana:
    image: grafana/grafana:12.3.1
    user: "472:472"
    deploy:
      replicas: 1
      labels:
        com.docker.stack.namespace: monitoring
    ports:
      - "3000:3000"
    environment:
      - "GF_SECURITY_ADMIN_PASSWORD=${VM_REALTICKET_GRAFANA_ADMIN_PASSWORD}"
      - "GF_PATHS_PROVISIONING=/etc/grafana/provisioning"
      - "GF_SNAPSHOTS_EXTERNAL_ENABLED=true"
      - "GF_SNAPSHOTS_REMOVE_EXPIRED=false"
    volumes:
      - /home/kyu4583/web04-RealTicket/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - /home/kyu4583/web04-RealTicket/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - realticket_grafana_data_shared:/var/lib/grafana
    networks:
      - realticket
    depends_on:
      - prometheus
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      labels:
        com.docker.stack.namespace: monitoring
    ports:
      - target: 8080
        published: 8082
        mode: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - realticket
  node-exporter:
    image: prom/node-exporter:v1.9.1
    deploy:
      mode: global
      labels:
        com.docker.stack.namespace: monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    networks:
      - realticket
volumes:
  realticket_mysql_data_shared:
    external: true
  prometheus_data:
    driver: local
  realticket_grafana_data_shared:
    external: true
networks:
  realticket:
    driver: overlay
    attachable: true
