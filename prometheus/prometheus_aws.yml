global:
  scrape_interval: 1s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nest-app'
    scrape_interval: 3s
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8080
        filters:
          - name: tag:aws:autoscaling:groupName
            values: [realticket-nest-asg]
          - name: instance-state-name
            values: [running]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_ec2_private_ip]
        target_label: instance

  - job_name: 'node-exporter'
    scrape_interval: 5s
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9100
        filters:
          - name: tag:aws:autoscaling:groupName
            values: [realticket-nest-asg]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_private_ip]
        target_label: instance
