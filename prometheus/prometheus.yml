global:
  scrape_interval: 1s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.cadvisor'
        type: 'A'
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*):8080'
        replacement: '${1}'
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - 'tasks.node-exporter'
        type: 'A'
        port: 9100
  - job_name: 'nest-app'
    dns_sd_configs:
      - names:
          - tasks.nest-baseline
          - tasks.nest-candidate
        type: 'A'
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*):8080'
        replacement: '${1}'
